<style>
:root{--ink:#17211f;--muted:#75807d;--line:#e9edeb;--bg:#f6f7f5;--card:#fff;--green:#167b62;--green2:#e8f4ef;--red:#d66056;--shadow:0 12px 35px #233a3010}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1260px;padding:0 28px;margin:auto}.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#ffffffd9}.top-inner{max-width:1260px;width:100%;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:18px;letter-spacing:-.4px}.brand-icon{width:35px;height:35px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:white;font-size:18px}.top-actions{display:flex;gap:10px;align-items:center}.secure{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-right:8px}.main{padding-top:32px;padding-bottom:60px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}.welcome h1{font-size:27px;letter-spacing:-.8px;margin:0 0 5px}.welcome p{color:var(--muted);margin:0}.month-control{display:flex;align-items:center;gap:9px}.month-control input{width:150px}.input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);outline:none}.input:focus,select:focus{border-color:#69a994;box-shadow:0 0 0 3px #167b6215}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:650;transition:.15s}.btn-primary{background:var(--green);color:white}.btn-primary:hover{background:#11634f}.btn-soft{background:var(--green2);color:var(--green)}.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-danger{color:#bd4a42;background:#fff0ef}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:19px 21px}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:27px;font-weight:750;letter-spacing:-.6px;margin-top:8px}.stat-foot{font-size:12px;color:var(--muted);margin-top:4px}.positive{color:var(--green)}.negative{color:var(--red)}.charts{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:18px}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-title{font-size:15px;font-weight:720}.panel-sub{font-size:12px;color:var(--muted);margin-top:2px}.chart-wrap{height:190px;position:relative}.chart-wrap canvas{width:100%;height:100%}.pie-area{display:flex;gap:19px;align-items:center;min-height:180px}.pie{width:148px;height:148px;border-radius:50%;flex:none;background:conic-gradient(#e9edeb 0 100%);position:relative}.pie:after{content:"";position:absolute;inset:30px;background:white;border-radius:50%}.legend{display:grid;gap:9px;min-width:0;flex:1}.legend-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}.legend-name{display:flex;align-items:center;gap:7px;min-width:0}.dot{width:9px;height:9px;border-radius:3px;flex:none}.legend-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.legend-amt{font-weight:650;white-space:nowrap}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 13px}.toolbar h2{font-size:17px;margin:0}.filters{display:flex;gap:8px;align-items:center}.filters input{width:210px}.filters select{min-width:125px}.table-panel{padding:0;overflow:hidden}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th{text-align:left;color:var(--muted);font-weight:550;font-size:12px;background:#fbfcfb;padding:12px 18px;border-bottom:1px solid var(--line)}td{padding:14px 18px;border-bottom:1px solid #f0f2f1}tr:last-child td{border-bottom:0}.amount{font-weight:700;white-space:nowrap}.tag{display:inline-flex;padding:4px 9px;border-radius:20px;background:#f0f3f1;color:#58635f;font-size:12px}.row-actions{display:flex;gap:6px;justify-content:flex-end}.icon-btn{width:30px;height:30px;background:transparent;border:0;border-radius:8px;color:#7a8581}.icon-btn:hover{background:#f1f4f2}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.modal-back{position:fixed;inset:0;background:#15211db3;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 24px 80px #0003}.modal h2{font-size:20px;margin:0 0 4px}.modal-desc{margin:0 0 20px;color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#59635f;font-weight:600}.field input,.field select{width:100%}.type-switch{display:flex;gap:8px}.type-switch button{flex:1}.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.upload-box{border:1.5px dashed #cdd8d3;background:#fafcfb;padding:18px;border-radius:12px;text-align:center;margin:14px 0;color:var(--muted)}.upload-box input{max-width:100%;margin-top:8px}.progress{font-size:12px;color:var(--green);margin:8px 0;min-height:18px}.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:var(--shadow)}.login-card .brand{margin-bottom:26px}.login-card h1{font-size:24px;margin:0 0 6px}.login-card p{color:var(--muted);margin:0 0 20px}.login-card .field{margin-bottom:14px}.login-card .btn{width:100%;margin-top:7px}.privacy-note{font-size:12px;color:var(--muted);background:#f5f8f6;padding:12px;border-radius:10px;margin-top:17px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17211f;color:white;padding:11px 17px;border-radius:11px;z-index:10;box-shadow:var(--shadow)}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}
@media(max-width:760px){.shell,.top-inner{padding-left:16px;padding-right:16px}.topbar{height:64px}.secure{display:none}.main{padding-top:23px}.welcome{align-items:flex-start;gap:15px;flex-direction:column}.welcome h1{font-size:24px}.stats{gap:9px}.stat{padding:14px}.stat-value{font-size:20px}.stat-foot{font-size:11px}.charts{grid-template-columns:1fr}.chart-wrap{height:180px}.pie-area{min-height:150px}.pie{width:125px;height:125px}.pie:after{inset:26px}.toolbar{align-items:flex-start;flex-direction:column}.filters{width:100%}.filters input{flex:1;width:auto;min-width:100px}.filters select{min-width:0;width:125px}.top-actions .btn{padding:8px 10px;font-size:12px}.brand{font-size:16px}.form-grid{grid-template-columns:1fr 1fr}.panel{padding:16px}}
@media(max-width:390px){.stats{grid-template-columns:1fr}.stat-value{font-size:23px}.filters select{width:105px}}

<script>
(()=>{'use strict';
const KEY='billflow_encrypted_v1',META='billflow_meta_v1';
const categories=['餐饮','交通','购物','住房','医疗','娱乐','工资','奖金','转账','其他'];
const colors=['#167b62','#e59b53','#6088cf','#aa77c9','#db6c62','#54a9aa','#d3b44f','#7d9c62','#7885a8','#a0a9a5'];
let records=[],cryptoKey=null,selectedMonth=new Date().toISOString().slice(0,7),filterCategory='全部',searchText='',editingId=null;
const root=document.querySelector('#root');
const money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
function b64(a){return btoa(String.fromCharCode(...new Uint8Array(a)))}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function persist(){if(!cryptoKey)return;const iv=crypto.getRandomValues(new Uint8Array(12));const enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,new TextEncoder().encode(JSON.stringify(records)));localStorage.setItem(KEY,JSON.stringify({iv:b64(iv),data:b64(enc)}));}
function showLogin(){const exists=!!localStorage.getItem(META);root.innerHTML=`<main class="login-screen"><section class="login-card"><div class="brand"><div class="brand-icon">▤</div>账单簿</div><h1>${exists?'欢迎回来':'创建你的私人账本'}</h1><p>${exists?'输入密码解锁本设备上的加密账单。':'设置一个密码，用于加密保存在本设备上的账单。'}</p><form id="loginForm"><div class="field"><label for="pass">${exists?'账本密码':'设置密码（至少 8 位）'}</label><input id="pass" class="input" type="password" minlength="8" autocomplete="${exists?'current-password':'new-password'}" required placeholder="请输入密码"></div>${!exists?'<div class="field"><label for="pass2">确认密码</label><input id="pass2" class="input" type="password" minlength="8" required placeholder="再次输入密码"></div>':''}<button class="btn btn-primary" type="submit">${exists?'解锁账本':'创建并开始使用'}</button></form><div class="privacy-note">🔒 数据只保存在当前浏览器，并使用 AES-GCM 加密。密码遗失无法找回；清除浏览器数据会删除账本。</div></section></main>`;
 document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const p=document.querySelector('#pass').value;try{if(exists){const meta=JSON.parse(localStorage.getItem(META));cryptoKey=await derive(p,unb64(meta.salt));const saved=JSON.parse(localStorage.getItem(KEY));if(!saved)throw Error('数据不存在');const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(saved.iv)},cryptoKey,unb64(saved.data));records=JSON.parse(new TextDecoder().decode(dec))||[]}else{if(p!==document.querySelector('#pass2').value){toast('两次输入的密码不一致');return}const salt=crypto.getRandomValues(new Uint8Array(16));cryptoKey=await derive(p,salt);localStorage.setItem(META,JSON.stringify({salt:b64(salt)}));records=[];await persist()}renderApp()}catch(err){cryptoKey=null;toast(exists?'密码错误或账本数据无法解密':'无法创建账本');}}}
function renderApp(){root.innerHTML=`<header class="topbar"><div class="top-inner"><div class="brand"><div class="brand-icon">▤</div>账单簿</div><div class="top-actions"><span class="secure">🔒 本机加密存储</span><button class="btn btn-outline" id="importBtn">导入账单</button><button class="btn btn-primary" id="addBtn">＋ 记一笔</button><button class="icon-btn" id="logoutBtn" title="锁定账本">锁定</button></div></div></header><main class="main shell"><section class="welcome"><div><h1>收支总览</h1><p>清晰记录每一笔，让财务状况一目了然。</p></div><div class="month-control"><label class="small" for="month">统计月份</label><input class="input" type="month" id="month" value="${selectedMonth}"></div></section><section class="stats" id="stats"></section><section class="charts"><div class="panel"><div class="panel-head"><div><div class="panel-title">近 6 个月收支趋势</div><div class="panel-sub">按月汇总收入与支出</div></div></div><div class="chart-wrap"><canvas id="barChart"></canvas></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">本月支出分类</div><div class="panel-sub">看看钱主要花在哪里</div></div></div><div class="pie-area"><div class="pie" id="pie"></div><div class="legend" id="legend"></div></div></div></section><section class="toolbar"><h2>账单明细 <span class="small" id="count"></span></h2><div class="filters"><input class="input" id="search" placeholder="搜索备注或类别"><select id="categoryFilter"><option>全部</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn btn-outline" id="exportBtn">导出 CSV</button></div></section><section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>日期</th><th>类型</th><th>分类</th><th>备注</th><th>金额</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="empty hidden" id="empty"><strong>还没有账单记录</strong>添加一笔或导入 CSV / Excel / 截图开始管理。</div></div></section><p class="small" style="text-align:center;margin-top:18px">账单保存在此设备的浏览器中。请定期导出备份；忘记密码无法恢复数据。</p></main>`;
 document.querySelector('#month').onchange=e=>{selectedMonth=e.target.value||selectedMonth;refresh()};document.querySelector('#search').oninput=e=>{searchText=e.target.value.toLowerCase();renderRows()};document.querySelector('#categoryFilter').onchange=e=>{filterCategory=e.target.value;renderRows()};document.querySelector('#addBtn').onclick=()=>openForm();document.querySelector('#importBtn').onclick=()=>openImport();document.querySelector('#exportBtn').onclick=exportCsv;document.querySelector('#logoutBtn').onclick=()=>{cryptoKey=null;records=[];showLogin()};refresh()}
function monthRecords(){return records.filter(x=>x.date?.slice(0,7)===selectedMonth)}
function refresh(){const list=monthRecords(),income=list.filter(x=>x.type==='收入').reduce((a,x)=>a+Number(x.amount),0),expense=list.filter(x=>x.type==='支出').reduce((a,x)=>a+Number(x.amount),0),prev=new Date(selectedMonth+'-01T00:00:00');prev.setMonth(prev.getMonth()-1);const prevKey=prev.toISOString().slice(0,7),prevExpense=records.filter(x=>x.date?.slice(0,7)===prevKey&&x.type==='支出').reduce((a,x)=>a+Number(x.amount),0),delta=prevExpense?((expense-prevExpense)/prevExpense*100):null;
 document.querySelector('#stats').innerHTML=`<article class="stat"><div class="stat-label">本月收入</div><div class="stat-value positive">${money(income)}</div><div class="stat-foot">共 ${list.filter(x=>x.type==='收入').length} 笔收入</div></article><article class="stat"><div class="stat-label">本月支出</div><div class="stat-value negative">${money(expense)}</div><div class="stat-foot">${delta===null?'暂无上月对比':`较上月${delta>0?'增加':'减少'} ${Math.abs(delta).toFixed(1)}%`}</div></article><article class="stat"><div class="stat-label">本月结余</div><div class="stat-value">${money(income-expense)}</div><div class="stat-foot">收入减去支出的余额</div></article>`;drawPie(list);drawBars();renderRows()}
function drawPie(list){const totals=categories.map(c=>({name:c,value:list.filter(x=>x.type==='支出'&&x.category===c).reduce((a,x)=>a+Number(x.amount),0)})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);const total=totals.reduce((a,x)=>a+x.value,0);let cur=0,stops=[];totals.forEach(x=>{const end=cur+x.value/total*100;stops.push(`${colors[categories.indexOf(x.name)]} ${cur}% ${end}%`);cur=end});document.querySelector('#pie').style.background=stops.length?`conic-gradient(${stops.join(',')})`:'conic-gradient(#e9edeb 0 100%)';document.querySelector('#legend').innerHTML=totals.length?totals.slice(0,5).map(x=>`<div class="legend-row"><div class="legend-name"><i class="dot" style="background:${colors[categories.indexOf(x.name)]}"></i><span>${escapeHtml(x.name)}</span></div><span class="legend-amt">${Math.round(x.value/total*100)}%</span></div>`).join(''):'<span class="small">本月暂无支出</span>'}
function drawBars(){const canvas=document.querySelector('#barChart'),ctx=canvas.getContext('2d'),rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.scale(dpr,dpr);const w=rect.width,h=rect.height;ctx.clearRect(0,0,w,h);let start=new Date(selectedMonth+'-01T00:00:00');start.setMonth(start.getMonth()-5);const ms=[];for(let i=0;i<6;i++){const d=new Date(start);d.setMonth(start.getMonth()+i);const key=d.toISOString().slice(0,7);const a=records.filter(x=>x.date?.slice(0,7)===key);ms.push({label:`${d.getMonth()+1}月`,inc:a.filter(x=>x.type==='收入').reduce((s,x)=>s+Number(x.amount),0),out:a.filter(x=>x.type==='支出').reduce((s,x)=>s+Number(x.amount),0)})}const max=Math.max(1,...ms.flatMap(x=>[x.inc,x.out])),pad={l:35,r:10,t:12,b:27},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillStyle='#8b9691';for(let i=0;i<4;i++){const y=pad.t+ch*i/3;ctx.strokeStyle='#edf0ee';ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(i===0?money(max).replace('¥',''):i===3?'0':(max*(1-i/3)/1000).toFixed(max>10000?0:1)+'k',pad.l-6,y+3)}const group=cw/6,bw=Math.min(15,group*.26);ms.forEach((m,i)=>{const cx=pad.l+group*(i+.5);for(const [v,col,offset] of [[m.inc,'#55aa8c',-bw-2],[m.out,'#e58b78',2]]){const bh=v/max*ch;ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(cx+offset,pad.t+ch-bh,bw,bh,4);ctx.fill()}ctx.fillStyle='#7b8581';ctx.textAlign='center';ctx.fillText(m.label,cx,h-7)});}
function renderRows(){const list=records.filter(x=>(!filterCategory||filterCategory==='全部'||x.category===filterCategory)&&(`${x.note||''} ${x.category||''}`.toLowerCase().includes(searchText))).sort((a,b)=>b.date.localeCompare(a.date));document.querySelector('#count').textContent=`(${list.length})`;document.querySelector('#rows').innerHTML=list.map(x=>`<tr><td>${escapeHtml(x.date)}</td><td><span class="tag">${x.type}</span></td><td>${escapeHtml(x.category)}</td><td>${escapeHtml(x.note||'—')}</td><td class="amount ${x.type==='收入'?'positive':'negative'}">${x.type==='收入'?'+':'−'}${money(x.amount)}</td><td><div class="row-actions"><button class="icon-btn" title="编辑" data-edit="${x.id}">✎</button><button class="icon-btn" title="删除" data-delete="${x.id}">×</button></div></td></tr>`).join('');document.querySelector('#empty').classList.toggle('hidden',list.length>0);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(records.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('确定删除这笔账单吗？')){records=records.filter(x=>x.id!==b.dataset.delete);await persist();refresh()}})}
function autoCategory(note,type){const s=(note||'').toLowerCase();const rules=[['餐饮',/餐|饭|咖啡|奶茶|外卖|美食|food|restaurant|starbucks|饮品/],['交通',/交通|地铁|公交|打车|出租|加油|停车|滴滴|高铁|火车|机票|taxi|uber/],['购物',/购物|超市|淘宝|京东|拼多多|商场|服饰|商品|mall|amazon/],['住房',/房租|物业|水电|燃气|宽带|住房/],['医疗',/医院|药|医疗|诊所|挂号/],['娱乐',/电影|游戏|旅游|演出|娱乐|会员|视频/],['工资',/工资|薪资|salary|payroll/],['奖金',/奖金|年终|补贴|红包/]];for(const [c,re] of rules)if(re.test(s))return c;return type==='收入'?'工资':'其他'}
function openForm(item){editingId=item?.id||null;const type=item?.type||'支出';root.insertAdjacentHTML('beforeend',`<div class="modal-back" id="formBack"><section class="modal"><h2>${item?'编辑账单':'记一笔'}</h2><p class="modal-desc">记录收入或支出，分类可随时修改。</p><form id="billForm"><div class="field full"><label>账单类型</label><div class="type-switch"><button type="button" class="btn ${type==='支出'?'btn-primary':'btn-outline'}" data-type="支出">支出</button><button type="button" class="btn ${type==='收入'?'btn-primary':'btn-outline'}" data-type="收入">收入</button></div><input type="hidden" id="fType" value="${type}"></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>金额（元）</label><input class="input" id="fAmount" type="number" min="0.01" step="0.01" required value="${item?.amount||''}" placeholder="0.00"></div><div class="field"><label>日期</label><input class="input" id="fDate" type="date" required value="${item?.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>分类</label><select id="fCategory">${categories.map(c=>`<option ${item?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>备注</label><input class="input" id="fNote" value="${escapeHtml(item?.note||'')}" placeholder="例如：午餐"></div></div><div class="modal-footer"><button type="button" class="btn btn-outline" id="cancelForm">取消</button><button class="btn btn-primary">保存账单</button></div></form></section></div>`);const close=()=>document.querySelector('#formBack')?.remove();document.querySelector('#cancelForm').onclick=close;document.querySelector('#formBack').onclick=e=>{if(e.target.id==='formBack')close()};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelector('#fType').value=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.className=`btn ${x===b?'btn-primary':'btn-outline'}`);if(!item)document.querySelector('#fCategory').value=autoCategory(document.querySelector('#fNote').value,b.dataset.type)});document.querySelector('#fNote').oninput=e=>{if(!item)document.querySelector('#fCategory').value=autoCategory(e.target.value,document.querySelector('#fType').value)};document.querySelector('#billForm').onsubmit=async e=>{e.preventDefault();const obj={id:editingId||crypto.randomUUID(),date:document.querySelector('#fDate').value,type:document.querySelector('#fType').value,category:document.querySelector('#fCategory').value,amount:Number(document.querySelector('#fAmount').value),note:document.querySelector('#fNote').value.trim(),source:'手动录入'};if(editingId)records=records.map(x=>x.id===editingId?obj:x);else records.push(obj);await persist();close();selectedMonth=obj.date.slice(0,7);document.querySelector('#month').value=selectedMonth;refresh();toast('账单已保存')}}
function openImport(){root.insertAdjacentHTML('beforeend',`<div class="modal-back" id="importBack"><section class="modal"><h2>导入账单</h2><p class="modal-desc">支持 CSV、Excel（.xlsx/.xls）和账单截图。导入后会自动识别并分类，请核对后确认。</p><div class="upload-box"><strong>选择账单文件</strong><br><span class="small">CSV / Excel / PNG / JPG / WEBP</span><br><input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.png,.jpg,.jpeg,.webp"></div><div class="progress" id="importProgress"></div><div id="preview"></div><div class="modal-footer"><button class="btn btn-outline" id="cancelImport">关闭</button><button class="btn btn-primary hidden" id="confirmImport">确认导入</button></div></section></div>`);const close=()=>document.querySelector('#importBack')?.remove();document.querySelector('#cancelImport').onclick=close;document.querySelector('#importBack').onclick=e=>{if(e.target.id==='importBack')close()};let pending=[];document.querySelector('#fileInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;const progress=document.querySelector('#importProgress');pending=[];try{if(file.type.startsWith('image/')){if(!window.Tesseract)throw Error('OCR组件加载失败，请检查网络后重试');progress.textContent='正在识别图片文字，请稍候…';const result=await Tesseract.recognize(file,'chi_sim+eng',{logger:m=>{if(m.status==='recognizing text')progress.textContent=`正在识别：${Math.round(m.progress*100)}%`}});pending=[parseOcr(result.data.text)];}else{progress.textContent='正在解析文件…';let rows;if(file.name.toLowerCase().endsWith('.csv'))rows=parseCsv(await file.text());else{if(!window.XLSX)throw Error('Excel解析组件加载失败，请检查网络后重试');const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}pending=rows.map(parseRow).filter(Boolean)}if(!pending.length)throw Error('没有识别到有效账单，请检查文件内容');pending.forEach(x=>{if(!x.category)x.category=autoCategory(x.note,x.type)});document.querySelector('#preview').innerHTML=`<div class="small" style="margin:8px 0">已识别 ${pending.length} 笔。导入前可先检查文件列是否包含日期、金额、类型、分类、备注等字段。</div><div style="max-height:160px;overflow:auto;font-size:12px">${pending.slice(0,6).map(x=>`${escapeHtml(x.date)}　${x.type}　${escapeHtml(x.category)}　${money(x.amount)}　${escapeHtml(x.note)}`).join('<br>')}</div>`;document.querySelector('#confirmImport').classList.remove('hidden');progress.textContent='识别完成';}catch(err){progress.textContent=err.message||'解析失败'}};document.querySelector('#confirmImport').onclick=async()=>{records.push(...pending.map(x=>({...x,id:crypto.randomUUID(),source:'文件导入'})));await persist();close();refresh();toast(`成功导入 ${pending.length} 笔账单`)}}
function parseDate(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return d.toISOString().slice(0,10)}const s=String(v??'').trim();let m=s.match(/(20\d{2})[年./-](\d{1,2})[月./-](\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=s.match(/(\d{1,2})[./-](\d{1,2})[./-](20\d{2})/);if(m)return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;return /^20\d{2}-\d\d-\d\d$/.test(s)?s:null}
function parseRow(r){if(!r||typeof r!=='object')return null;const entries=Object.entries(r),find=names=>{const pair=entries.find(([k])=>names.some(n=>String(k).toLowerCase().includes(n)));return pair?.[1]};const date=parseDate(find(['日期','时间','date','time','交易时间']));let amount=String(find(['金额','amount','实付','收支金额','交易金额'])??'').replace(/[¥￥,\s]/g,'');const n=Number(amount);if(!date||!Number.isFinite(n)||!n)return null;const note=String(find(['备注','商品','摘要','说明','note','description','商户','交易对方'])??'');let t=String(find(['类型','收支','方向','type'])??'');const type=/收入|转入|入账|income|credit/i.test(t)?'收入':/支出|转出|出账|expense|debit/i.test(t)?'支出':n<0?'支出':'支出';const category=String(find(['分类','类别','category'])??'')||autoCategory(note,type);return {date,type,category:categories.includes(category)?category:autoCategory(note,type),amount:Math.abs(n),note}}
function parseCsv(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const delimiter=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';const cells=line=>{let out=[],cur='',quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'&&quote){cur+='"';i++}else if(c==='"')quote=!quote;else if(c===delimiter&&!quote){out.push(cur);cur=''}else cur+=c}out.push(cur);return out};const head=cells(lines[0]).map(x=>x.trim());return lines.slice(1).map(l=>Object.fromEntries(cells(l).map((v,i)=>[head[i]||`列${i+1}`,v.trim()]))) }
function parseOcr(text){const date=parseDate(text.match(/20\d{2}[年./-]\d{1,2}[月./-]\d{1,2}/)?.[0])||new Date().toISOString().slice(0,10);const amounts=[...text.matchAll(/[¥￥]?\s*(\d{1,6}(?:,\d{3})*(?:\.\d{1,2})?)/g)].map(m=>Number(m[1].replace(/,/g,''))).filter(n=>n>0&&n<100000000);const amount=amounts.length?Math.max(...amounts):0;const type=/收入|收款|到账|转入|工资/.test(text)?'收入':'支出';const note=text.split(/\n/).map(x=>x.trim()).find(x=>x.length>1&&x.length<35)||'截图账单';return {date,type,category:autoCategory(text,type),amount,note}}
function exportCsv(){const rows=[['日期','类型','分类','金额','备注'],...records.map(x=>[x.date,x.type,x.category,x.amount,x.note||''])];const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`账单簿-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}
window.addEventListener('resize',()=>{if(cryptoKey&&document.querySelector('#barChart'))drawBars()});showLogin();
})();
</script></body></html>
