services:
  - type: web
    name: billflow
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: billflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PG_POOL_MAX
        value: 10

databases:
  - name: billflow-db
    databaseName: billflow
    user: billflow
    plan: basic-256mb
